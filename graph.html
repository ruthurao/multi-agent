    <path d="M 450 78 L 450 146" fill="none" stroke="#111111" marker-end="url(#arrow)"/><path d="M 300 318 C 300 260, 360 208, 372 168" fill="none" stroke="#555555" marker-end="url(#arrow)"/><path d="M 110 318 C 110 260, 360 208, 372 168" fill="none" stroke="#555555" marker-end="url(#arrow)"/><path d="M 740 318 C 740 260, 360 208, 372 168" fill="none" stroke="#555555" marker-end="url(#arrow)"/><path d="M 510 318 C 510 260, 360 208, 372 168" fill="none" stroke="#555555" marker-end="url(#arrow)"/><path d="M 540 168 C 610 168, 610 470, 528 470" fill="none" stroke="#111111" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M 450 190 C 450 238, 300 270, 300 318" fill="none" stroke="#111111" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M 450 190 C 450 238, 110 270, 110 318" fill="none" stroke="#111111" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M 450 190 C 450 238, 740 270, 740 318" fill="none" stroke="#111111" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M 450 190 C 450 238, 510 270, 510 318" fill="none" stroke="#111111" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <rect x="372" y="34" width="156" height="44" rx="8" fill="#ffffff" stroke="#111111"/><text x="450" y="61" text-anchor="middle" font-size="15">start</text><rect x="372" y="146" width="156" height="44" rx="8" fill="#ffffff" stroke="#111111"/><text x="450" y="173" text-anchor="middle" font-size="15">supervisor</text><rect x="32" y="318" width="156" height="44" rx="8" fill="#ffffff" stroke="#111111"/><text x="110" y="345" text-anchor="middle" font-size="15">intake</text><rect x="222" y="318" width="156" height="44" rx="8" fill="#ffffff" stroke="#111111"/><text x="300" y="345" text-anchor="middle" font-size="15">enrichment</text><rect x="432" y="318" width="156" height="44" rx="8" fill="#ffffff" stroke="#111111"/><text x="510" y="345" text-anchor="middle" font-size="15">risk scoring</text><rect x="662" y="318" width="156" height="44" rx="8" fill="#ffffff" stroke="#111111"/><text x="740" y="345" text-anchor="middle" font-size="15">recommendation</text><rect x="372" y="448" width="156" height="44" rx="8" fill="#ffffff" stroke="#111111"/><text x="450" y="475" text-anchor="middle" font-size="15">end</text>
